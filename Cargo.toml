[workspace]
resolver = "2"
members = [
    "crates/cabinet-core",
    "crates/cabinet-catalog",
    "crates/cabinet-sheets",
    "crates/solidcraft-bridge",
    "crates/cabinet-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brendan779/CabinetForSolidcraft"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
insta = { version = "1.49", features = ["json"] }
cabinet-core = { path = "crates/cabinet-core" }
cabinet-catalog = { path = "crates/cabinet-catalog" }
cabinet-sheets = { path = "crates/cabinet-sheets" }
solidcraft-bridge = { path = "crates/solidcraft-bridge" }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
