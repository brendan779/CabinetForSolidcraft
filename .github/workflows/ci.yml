name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install xcodegen cargo-deny
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check
        run: scripts/check.sh
