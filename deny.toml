# cargo deny: licences, advisories, bans and sources of every dependency (INF-5).
# Run by scripts/check.sh. Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
ignore = [
    # basic-toml is unmaintained with no successor release. Only uniffi_bindgen uses it, at build
    # time, to read uniffi.toml. Drop this when uniffi moves to `toml`.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via uniffi_bindgen; no fix upstream" },
]

[licenses]
# Permissive licences, plus MPL-2.0 for uniffi (file-level copyleft: we link it unmodified).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
# The workspace crates depend on each other by path and are not published.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
