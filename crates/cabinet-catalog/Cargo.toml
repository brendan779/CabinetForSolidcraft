[package]
name = "cabinet-catalog"
description = "Board, edge tape and hardware catalog data: schema, loading and validation."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zip = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[features]
# Material packs: zip files read and checked on this Mac. Off in the SolidCraft plugin, whose
# WebAssembly has no file system and can't take zip's random-number glue.
default = ["packs"]
packs = ["dep:zip", "dep:flate2", "dep:sha2"]

[lints]
workspace = true

[[example]]
name = "install_pack"
required-features = ["packs"]
